spring.application.name=user-service
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${USER_DB_URL:jdbc:mysql://localhost:3306/edu}
spring.datasource.username=${USER_DB_USERNAME:root}
spring.datasource.password=${USER_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
server.port=${USER_SERVICE_PORT:8082}
# Accept /api/action-logs and /api/action-logs/ (Spring Boot 3 default is strict)
spring.mvc.trailing-slash-match=true

# Logging
logging.level.root=INFO
logging.level.vn.edu.primary.teacher_support.service.OtpService=DEBUG
logging.level.org.springframework.mail=DEBUG

# Eureka client
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
#mail
spring.mail.host=${USER_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${USER_MAIL_PORT:587}
spring.mail.username=${USER_MAIL_USERNAME:}
spring.mail.password=${USER_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
# OTP configuration
app.mail.test-mode=${APP_MAIL_TEST_MODE:false}
# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${USER_GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# Fix session when using Spring Cloud Gateway proxy
server.forward-headers-strategy=framework
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true

# Session cookie settings to help preserve OAuth2 state through Gateway
# Use SameSite=Lax to allow top-level OAuth2 redirects to include the cookie
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=false
server.servlet.session.tracking-modes=cookie
# JWT secret
jwt.secret=${JWT_SECRET:your_super_secret_key_change_in_production_very_long_string}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Frontend base URL (OAuth redirect after login). Production: https://teachprimary.dev
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}