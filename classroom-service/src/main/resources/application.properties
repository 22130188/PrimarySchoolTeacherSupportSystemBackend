spring.application.name=classroom-service
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${CLASSROOM_SERVICE_PORT:8085}

# Database - separate DB for classroom-service
spring.datasource.url=${CLASSROOM_DB_URL:jdbc:mysql://localhost:3306/classroom_db?createDatabaseIfNotExist=true}
spring.datasource.username=${CLASSROOM_DB_USERNAME:root}
spring.datasource.password=${CLASSROOM_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Eureka client
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Mail
spring.mail.host=${CLASSROOM_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${CLASSROOM_MAIL_PORT:587}
spring.mail.username=${CLASSROOM_MAIL_USERNAME:}
spring.mail.password=${CLASSROOM_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false

# JWT secret (same as user-service for token validation)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Classroom config
classroom.invite.expiry-days=7
classroom.frontend.base-url=${CLASSROOM_FRONTEND_BASE_URL:http://localhost:5173}
google.drive.api-key=AIzaSyD4jN3KFoefV9npftw0m0N0ZKeOlY8N9iQ

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
