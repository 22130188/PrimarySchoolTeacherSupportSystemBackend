spring:
  application:
    name: test-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  datasource:
    url: jdbc:mysql://localhost:3306/test_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
#  port: 8087
  port: 8088
  # servlet:
  #   context-path: /api/tests  # Đã bỏ vì trùng với @RequestMapping

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your_super_secret_key_change_in_production_very_long_string}
  secret-key: ${JWT_SECRET:your_super_secret_key_change_in_production_very_long_string}
  expiration: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

# Python API for DOCX generation
