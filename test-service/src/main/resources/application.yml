spring:
  application:
    name: test-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  sql:
    init:
      mode: always
      platform: mysql
      encoding: UTF-8
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/test_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
#  port: 8087
  port: 8088
  # servlet:
  #   context-path: /api/tests  # Đã bỏ vì trùng với @RequestMapping

spring.mvc:
  trailing-slash-match: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your_super_secret_key_change_in_production_very_long_string}
  secret-key: ${JWT_SECRET:your_super_secret_key_change_in_production_very_long_string}
  expiration: ${JWT_EXPIRATION_MS:86400000}  # 24 hours

# Python API for DOCX generation
python:
  api:
    url: ${PYTHON_API_URL:http://localhost:8001}

