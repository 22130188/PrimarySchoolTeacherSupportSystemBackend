spring.application.name=textbook-service
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${TEXTBOOK_SERVICE_PORT:8090}

# Database
spring.datasource.url=${TEXTBOOK_DB_URL:jdbc:mysql://localhost:3306/textbook_db?createDatabaseIfNotExist=true}
spring.datasource.username=${TEXTBOOK_DB_USERNAME:root}
spring.datasource.password=${TEXTBOOK_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Eureka client
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
