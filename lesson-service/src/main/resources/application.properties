spring.application.name=lesson-service
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.port=${LESSON_SERVICE_PORT:8087}

spring.datasource.url=${LESSON_DB_URL:jdbc:mysql://localhost:3306/lesson_db?createDatabaseIfNotExist=true}
spring.datasource.username=${LESSON_DB_USERNAME:root}
spring.datasource.password=${LESSON_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
