# Server Configuration
spring.application.name=image-service
server.port=8083

# Database Configuration
spring.datasource.url=${IMAGE_DB_URL:jdbc:mysql://localhost:3306/image_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dlyhvdonu}
cloudinary.api-key=${CLOUDINARY_API_KEY:358137225132925}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:bSvXNjEDBhwnVsvS5FEFrRg7s18}
cloudinary.folder=image_generation

# Python API Configuration
python.image.api-url=${PYTHON_API_URL:http://localhost:8001}

# Logging
logging.level.vn.edu.primary.image=DEBUG