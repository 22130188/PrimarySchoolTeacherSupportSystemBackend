spring:
  application:
    name: tts-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  datasource:
    url: jdbc:mysql://localhost:3306/tts_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8084
  servlet:
    context-path: /api/tts

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# JWT Configuration
jwt:
  secret-key: your_super_secret_key_change_in_production_very_long_string
  expiration: 86400000  # 24 hours

# Python TTS API
python:
  tts:
    api-url: http://localhost:8001/api
    timeout: 30000

# Cloudinary Configuration (set via environment variables in production)
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dlyhvdonu}
  api-key: ${CLOUDINARY_API_KEY:358137225132925}
  api-secret: ${CLOUDINARY_API_SECRET:bSvXNjEDBhwnVsvS5FEFrRg7s18}
  folder: tts-audios
